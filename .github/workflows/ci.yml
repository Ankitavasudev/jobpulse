name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o k8s-batch-analyzer .

      - name: Analyze the bundled capture
        run: |
          ./k8s-batch-analyzer --from examples/capture.json
          ./k8s-batch-analyzer --from examples/capture.json -o json > out.json
          grep -q '"jobs": 6' out.json
          grep -q '"succeeded": 2' out.json
          grep -q '"failed": 1' out.json
          ./k8s-batch-analyzer --from examples/capture.json -o csv > out.csv
          grep -q 'ml-jobs,train-resnet,Succeeded,1,0,0,3' out.csv
          ./k8s-batch-analyzer --from examples/capture.json --namespace ml-jobs | grep -q '4 jobs'

      - name: Check the HTML report
        run: |
          ./k8s-batch-analyzer --from examples/capture.json -o html > report.html
          grep -q '<!DOCTYPE html>' report.html
          grep -q 'Batch jobs' report.html
          grep -q 'train-resnet' report.html
          # The report must work offline: no scripts, no external requests.
          ! grep -q '<script' report.html
          ! grep -qE '(<link|<img|src="http)' report.html

      - name: Version
        run: ./k8s-batch-analyzer version
